version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: vocabversus
      POSTGRES_PASSWORD: vocabversus
      POSTGRES_DB: wordsets
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vocabversus -d wordsets"]
      interval: 5s
      timeout: 5s
      retries: 10

  wordset-service:
    build:
      context: ./backend/wordset-service
      dockerfile: Dockerfile
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=wordsets;Username=vocabversus;Password=vocabversus"
    depends_on:
      postgres:
        condition: service_healthy

  game-engine:
    build:
      context: ./backend/game-engine
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Services__WordsetServiceUrl: "http://wordset-service:8080"
    depends_on:
      - wordset-service

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    environment:
      VITE_GAME_ENGINE_URL: "http://localhost:5000"
      VITE_WORDSET_SERVICE_URL: "http://localhost:5001"
    depends_on:
      - game-engine

volumes:
  postgres_data:
